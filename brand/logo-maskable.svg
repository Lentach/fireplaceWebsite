<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F4F4"/>
      <stop offset="50%" stop-color="#959595"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background; hex scaled to ~58% so the maskable safe zone never clips it -->
  <rect width="512" height="512" fill="#070707"/>
  <g transform="translate(256,256) scale(0.58) translate(-256,-256)">
    <polygon points="256,72 416,164 416,348 256,440 96,348 96,164"
             fill="url(#face)" stroke="url(#rim)" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
